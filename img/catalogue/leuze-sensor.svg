<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="100%" height="100%">
    <defs>
        <!-- Background Gradient -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a"/>
            <stop offset="50%" stop-color="#1e293b"/>
            <stop offset="100%" stop-color="#090d16"/>
        </linearGradient>
        <!-- Body Gradient -->
        <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#334155"/>
            <stop offset="100%" stop-color="#1e293b"/>
        </linearGradient>
        <!-- Ambient Glow -->
        <radialGradient id="glow" cx="50%" cy="45%" r="60%">
            <stop offset="0%" stop-color="#0284c7" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
        </radialGradient>
        <!-- Tech Grid Pattern -->
        <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
            <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.7" opacity="0.35"/>
        </pattern>
    </defs>

    <!-- Canvas Background -->
    <rect width="480" height="400" fill="url(#bgGrad)"/>
    <rect width="480" height="400" fill="url(#glow)"/>
    <rect width="480" height="400" fill="url(#grid)"/>

    <!-- Subtle Tech Borders -->
    <rect x="15" y="15" width="450" height="370" rx="8" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 6"/>

    <!-- Hardware Illustration -->
    
            <!-- Threaded Sensor Body -->
            <rect x="130" y="160" width="180" height="60" rx="6" fill="url(#bodyGrad)" stroke="#475569" stroke-width="3"/>
            <!-- Threading Lines -->
            <line x1="160" y1="160" x2="160" y2="220" stroke="#334155" stroke-width="3"/>
            <line x1="175" y1="160" x2="175" y2="220" stroke="#334155" stroke-width="3"/>
            <line x1="190" y1="160" x2="190" y2="220" stroke="#334155" stroke-width="3"/>
            <line x1="205" y1="160" x2="205" y2="220" stroke="#334155" stroke-width="3"/>
            <line x1="220" y1="160" x2="220" y2="220" stroke="#334155" stroke-width="3"/>
            <!-- Sensing Face -->
            <path d="M 310 165 L 340 175 L 340 205 L 310 215 Z" fill="#f59e0b"/>
            <!-- Detection Waves -->
            <path d="M 355 170 C 365 180, 365 200, 355 210" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
            <path d="M 370 160 C 385 180, 385 200, 370 220" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
            <!-- Cable Exit -->
            <path d="M 130 190 L 70 190" stroke="#0f172a" stroke-width="12" stroke-linecap="round"/>
            <!-- LED Indicator -->
            <circle cx="150" cy="175" r="5" fill="#22c55e"/>
            

    <!-- Product Title Badge at Bottom -->
    <rect x="30" y="340" width="420" height="36" rx="6" fill="#0b1329" stroke="#1e293b"/>
    <text x="45" y="363" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">LEUZE Optical &amp; Safety Sensors</text>
    <text x="435" y="363" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#f59e0b">The Sensor People</text>
</svg>