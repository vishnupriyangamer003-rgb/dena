<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="100%" height="100%">
    <defs>
        <!-- Background Gradient -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a"/>
            <stop offset="50%" stop-color="#1e293b"/>
            <stop offset="100%" stop-color="#090d16"/>
        </linearGradient>
        <!-- Body Gradient -->
        <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#334155"/>
            <stop offset="100%" stop-color="#1e293b"/>
        </linearGradient>
        <!-- Ambient Glow -->
        <radialGradient id="glow" cx="50%" cy="45%" r="60%">
            <stop offset="0%" stop-color="#0284c7" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
        </radialGradient>
        <!-- Tech Grid Pattern -->
        <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
            <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.7" opacity="0.35"/>
        </pattern>
    </defs>

    <!-- Canvas Background -->
    <rect width="480" height="400" fill="url(#bgGrad)"/>
    <rect width="480" height="400" fill="url(#glow)"/>
    <rect width="480" height="400" fill="url(#grid)"/>

    <!-- Subtle Tech Borders -->
    <rect x="15" y="15" width="450" height="370" rx="8" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 6"/>

    <!-- Hardware Illustration -->
    
            <!-- HMI Bezel -->
            <rect x="100" y="85" width="280" height="210" rx="10" fill="url(#bodyGrad)" stroke="#475569" stroke-width="4"/>
            <!-- Screen Inset -->
            <rect x="120" y="105" width="240" height="150" rx="4" fill="#020617" stroke="#334155" stroke-width="2"/>
            <!-- Dashboard Display -->
            <rect x="135" y="120" width="100" height="55" rx="4" fill="#0f172a"/>
            <text x="145" y="140" font-family="Arial,sans-serif" font-size="11" fill="#38bdf8" font-weight="bold">SYSTEM STATUS</text>
            <text x="145" y="162" font-family="Arial,sans-serif" font-size="18" fill="#22c55e" font-weight="bold">ONLINE</text>
            <rect x="245" y="120" width="100" height="55" rx="4" fill="#0f172a"/>
            <text x="255" y="140" font-family="Arial,sans-serif" font-size="11" fill="#f59e0b" font-weight="bold">RPM / FREQ</text>
            <text x="255" y="162" font-family="Arial,sans-serif" font-size="18" fill="#f59e0b" font-weight="bold">1480 / 50Hz</text>
            <!-- Graph Line -->
            <path d="M 135 230 L 170 215 L 210 225 L 250 195 L 290 205 L 335 185" fill="none" stroke="#0284c7" stroke-width="3"/>
            <circle cx="335" cy="185" r="4" fill="#38bdf8"/>
            <!-- Bottom Function Buttons -->
            <circle cx="150" cy="275" r="7" fill="#334155"/>
            <circle cx="190" cy="275" r="7" fill="#334155"/>
            <circle cx="230" cy="275" r="7" fill="#334155"/>
            <circle cx="270" cy="275" r="7" fill="#334155"/>
            <circle cx="310" cy="275" r="7" fill="#334155"/>
            

    <!-- Product Title Badge at Bottom -->
    <rect x="30" y="340" width="420" height="36" rx="6" fill="#0b1329" stroke="#1e293b"/>
    <text x="45" y="363" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">DELTA Industrial PC (IPC)</text>
    <text x="435" y="363" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#f59e0b">Rugged Embedded Box</text>
</svg>