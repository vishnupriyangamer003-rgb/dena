<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="100%" height="100%">
    <defs>
        <!-- Background Gradient -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a"/>
            <stop offset="50%" stop-color="#1e293b"/>
            <stop offset="100%" stop-color="#090d16"/>
        </linearGradient>
        <!-- Body Gradient -->
        <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#334155"/>
            <stop offset="100%" stop-color="#1e293b"/>
        </linearGradient>
        <!-- Ambient Glow -->
        <radialGradient id="glow" cx="50%" cy="45%" r="60%">
            <stop offset="0%" stop-color="#0284c7" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
        </radialGradient>
        <!-- Tech Grid Pattern -->
        <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
            <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.7" opacity="0.35"/>
        </pattern>
    </defs>

    <!-- Canvas Background -->
    <rect width="480" height="400" fill="url(#bgGrad)"/>
    <rect width="480" height="400" fill="url(#glow)"/>
    <rect width="480" height="400" fill="url(#grid)"/>

    <!-- Subtle Tech Borders -->
    <rect x="15" y="15" width="450" height="370" rx="8" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 6"/>

    <!-- Hardware Illustration -->
    
            <!-- Servo Drive Unit -->
            <rect x="110" y="70" width="120" height="250" rx="8" fill="url(#bodyGrad)" stroke="#475569" stroke-width="3"/>
            <rect x="125" y="90" width="90" height="40" rx="4" fill="#020617"/>
            <text x="140" y="117" font-family="Courier,monospace" font-size="18" fill="#22c55e" font-weight="bold">READY</text>
            <rect x="125" y="145" width="90" height="60" rx="4" fill="#0f172a" stroke="#334155"/>
            <text x="142" y="180" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8">CN1 ENCODER</text>
            <rect x="125" y="220" width="90" height="70" rx="4" fill="#0f172a" stroke="#334155"/>
            <circle cx="145" cy="245" r="4" fill="#f59e0b"/>
            <circle cx="170" cy="245" r="4" fill="#f59e0b"/>
            <circle cx="195" cy="245" r="4" fill="#f59e0b"/>
            <!-- Servo Motor Body -->
            <rect x="260" y="140" width="120" height="120" rx="10" fill="url(#bodyGrad)" stroke="#475569" stroke-width="3"/>
            <circle cx="320" cy="200" r="42" fill="#1e293b" stroke="#334155" stroke-width="3"/>
            <circle cx="320" cy="200" r="16" fill="#64748b" stroke="#94a3b8" stroke-width="2"/>
            <!-- Shaft -->
            <circle cx="320" cy="200" r="8" fill="#f59e0b"/>
            <!-- Motor Mounting Flange Holes -->
            <circle cx="275" cy="155" r="4" fill="#475569"/>
            <circle cx="365" cy="155" r="4" fill="#475569"/>
            <circle cx="275" cy="245" r="4" fill="#475569"/>
            <circle cx="365" cy="245" r="4" fill="#475569"/>
            <!-- Cable Connection -->
            <path d="M 230 260 C 245 280, 260 270, 275 250" fill="none" stroke="#f59e0b" stroke-width="5"/>
            

    <!-- Product Title Badge at Bottom -->
    <rect x="30" y="340" width="420" height="36" rx="6" fill="#0b1329" stroke="#1e293b"/>
    <text x="45" y="363" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">INVT Servo - DA200/DA180</text>
    <text x="435" y="363" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#f59e0b">High Dynamic AC Drive</text>
</svg>