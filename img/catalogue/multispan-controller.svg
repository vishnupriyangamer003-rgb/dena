<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="100%" height="100%">
    <defs>
        <!-- Background Gradient -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a"/>
            <stop offset="50%" stop-color="#1e293b"/>
            <stop offset="100%" stop-color="#090d16"/>
        </linearGradient>
        <!-- Body Gradient -->
        <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#334155"/>
            <stop offset="100%" stop-color="#1e293b"/>
        </linearGradient>
        <!-- Ambient Glow -->
        <radialGradient id="glow" cx="50%" cy="45%" r="60%">
            <stop offset="0%" stop-color="#0284c7" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
        </radialGradient>
        <!-- Tech Grid Pattern -->
        <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
            <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.7" opacity="0.35"/>
        </pattern>
    </defs>

    <!-- Canvas Background -->
    <rect width="480" height="400" fill="url(#bgGrad)"/>
    <rect width="480" height="400" fill="url(#glow)"/>
    <rect width="480" height="400" fill="url(#grid)"/>

    <!-- Subtle Tech Borders -->
    <rect x="15" y="15" width="450" height="370" rx="8" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 6"/>

    <!-- Hardware Illustration -->
    
            <!-- 1/16 DIN Temperature Controller -->
            <rect x="135" y="80" width="210" height="210" rx="8" fill="url(#bodyGrad)" stroke="#475569" stroke-width="3"/>
            <!-- Display Window -->
            <rect x="150" y="95" width="180" height="110" rx="5" fill="#020617"/>
            <!-- PV Value (Red) -->
            <text x="165" y="145" font-family="Courier,monospace" font-size="34" fill="#ef4444" font-weight="bold">185.4</text>
            <text x="300" y="125" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8">PV °C</text>
            <!-- SV Value (Green) -->
            <text x="165" y="185" font-family="Courier,monospace" font-size="28" fill="#22c55e" font-weight="bold">185.0</text>
            <text x="300" y="175" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8">SV °C</text>
            <!-- Control Keys -->
            <rect x="155" y="225" width="35" height="24" rx="3" fill="#1e293b" stroke="#334155"/>
            <text x="162" y="241" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8">SET</text>
            <rect x="200" y="225" width="35" height="24" rx="3" fill="#1e293b" stroke="#334155"/>
            <text x="212" y="241" font-family="Arial,sans-serif" font-size="11" fill="#f59e0b">▲</text>
            <rect x="245" y="225" width="35" height="24" rx="3" fill="#1e293b" stroke="#334155"/>
            <text x="257" y="241" font-family="Arial,sans-serif" font-size="11" fill="#f59e0b">▼</text>
            <rect x="290" y="225" width="35" height="24" rx="3" fill="#1e293b" stroke="#334155"/>
            <text x="300" y="241" font-family="Arial,sans-serif" font-size="11" fill="#38bdf8">◄</text>
            

    <!-- Product Title Badge at Bottom -->
    <rect x="30" y="340" width="420" height="36" rx="6" fill="#0b1329" stroke="#1e293b"/>
    <text x="45" y="363" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">MULTISPAN Process Instruments</text>
    <text x="435" y="363" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#f59e0b">PID &amp; Panel Meters</text>
</svg>