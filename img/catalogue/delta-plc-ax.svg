<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="100%" height="100%">
    <defs>
        <!-- Background Gradient -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a"/>
            <stop offset="50%" stop-color="#1e293b"/>
            <stop offset="100%" stop-color="#090d16"/>
        </linearGradient>
        <!-- Body Gradient -->
        <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#334155"/>
            <stop offset="100%" stop-color="#1e293b"/>
        </linearGradient>
        <!-- Ambient Glow -->
        <radialGradient id="glow" cx="50%" cy="45%" r="60%">
            <stop offset="0%" stop-color="#0284c7" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
        </radialGradient>
        <!-- Tech Grid Pattern -->
        <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
            <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.7" opacity="0.35"/>
        </pattern>
    </defs>

    <!-- Canvas Background -->
    <rect width="480" height="400" fill="url(#bgGrad)"/>
    <rect width="480" height="400" fill="url(#glow)"/>
    <rect width="480" height="400" fill="url(#grid)"/>

    <!-- Subtle Tech Borders -->
    <rect x="15" y="15" width="450" height="370" rx="8" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 6"/>

    <!-- Hardware Illustration -->
    
            <!-- PLC Body -->
            <rect x="140" y="70" width="200" height="260" rx="12" fill="url(#bodyGrad)" stroke="#475569" stroke-width="3"/>
            <!-- Top Terminals -->
            <rect x="155" y="80" width="170" height="28" rx="4" fill="#1e293b"/>
            <circle cx="170" cy="94" r="5" fill="#f59e0b"/>
            <circle cx="190" cy="94" r="5" fill="#f59e0b"/>
            <circle cx="210" cy="94" r="5" fill="#f59e0b"/>
            <circle cx="230" cy="94" r="5" fill="#f59e0b"/>
            <circle cx="250" cy="94" r="5" fill="#f59e0b"/>
            <circle cx="270" cy="94" r="5" fill="#f59e0b"/>
            <circle cx="290" cy="94" r="5" fill="#f59e0b"/>
            <circle cx="310" cy="94" r="5" fill="#f59e0b"/>
            <!-- Status LEDs -->
            <rect x="160" y="125" width="160" height="45" rx="6" fill="#0f172a"/>
            <circle cx="180" cy="147" r="4" fill="#22c55e"><animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/></circle>
            <text x="190" y="151" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8" font-weight="bold">RUN</text>
            <circle cx="230" cy="147" r="4" fill="#eab308"/>
            <text x="240" y="151" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8" font-weight="bold">ERR</text>
            <circle cx="280" cy="147" r="4" fill="#38bdf8"/>
            <text x="290" y="151" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8" font-weight="bold">COM</text>
            <!-- Port / Module bay -->
            <rect x="160" y="185" width="85" height="75" rx="6" fill="#0f172a" stroke="#334155"/>
            <rect x="175" y="200" width="55" height="45" rx="3" fill="#334155"/>
            <!-- Vent grills -->
            <line x1="265" y1="190" x2="310" y2="190" stroke="#334155" stroke-width="3"/>
            <line x1="265" y1="205" x2="310" y2="205" stroke="#334155" stroke-width="3"/>
            <line x1="265" y1="220" x2="310" y2="220" stroke="#334155" stroke-width="3"/>
            <line x1="265" y1="235" x2="310" y2="235" stroke="#334155" stroke-width="3"/>
            <line x1="265" y1="250" x2="310" y2="250" stroke="#334155" stroke-width="3"/>
            <!-- Bottom Terminals -->
            <rect x="155" y="292" width="170" height="28" rx="4" fill="#1e293b"/>
            <circle cx="170" cy="306" r="5" fill="#f59e0b"/>
            <circle cx="190" cy="306" r="5" fill="#f59e0b"/>
            <circle cx="210" cy="306" r="5" fill="#f59e0b"/>
            <circle cx="230" cy="306" r="5" fill="#f59e0b"/>
            <circle cx="250" cy="306" r="5" fill="#f59e0b"/>
            <circle cx="270" cy="306" r="5" fill="#f59e0b"/>
            <circle cx="290" cy="306" r="5" fill="#f59e0b"/>
            <circle cx="310" cy="306" r="5" fill="#f59e0b"/>
            

    <!-- Product Title Badge at Bottom -->
    <rect x="30" y="340" width="420" height="36" rx="6" fill="#0b1329" stroke="#1e293b"/>
    <text x="45" y="363" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">DELTA PLC - AX-5 Series</text>
    <text x="435" y="363" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#f59e0b">Motion PAC</text>
</svg>