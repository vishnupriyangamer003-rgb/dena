<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="100%" height="100%">
    <defs>
        <!-- Background Gradient -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a"/>
            <stop offset="50%" stop-color="#1e293b"/>
            <stop offset="100%" stop-color="#090d16"/>
        </linearGradient>
        <!-- Body Gradient -->
        <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#334155"/>
            <stop offset="100%" stop-color="#1e293b"/>
        </linearGradient>
        <!-- Ambient Glow -->
        <radialGradient id="glow" cx="50%" cy="45%" r="60%">
            <stop offset="0%" stop-color="#0284c7" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
        </radialGradient>
        <!-- Tech Grid Pattern -->
        <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
            <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.7" opacity="0.35"/>
        </pattern>
    </defs>

    <!-- Canvas Background -->
    <rect width="480" height="400" fill="url(#bgGrad)"/>
    <rect width="480" height="400" fill="url(#glow)"/>
    <rect width="480" height="400" fill="url(#grid)"/>

    <!-- Subtle Tech Borders -->
    <rect x="15" y="15" width="450" height="370" rx="8" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 6"/>

    <!-- Hardware Illustration -->
    
            <!-- DIN Rail SMPS -->
            <rect x="150" y="75" width="180" height="250" rx="8" fill="url(#bodyGrad)" stroke="#475569" stroke-width="3"/>
            <!-- Perforated Air Vents -->
            <g fill="#334155">
                <circle cx="175" cy="110" r="3"/><circle cx="195" cy="110" r="3"/><circle cx="215" cy="110" r="3"/><circle cx="235" cy="110" r="3"/><circle cx="255" cy="110" r="3"/><circle cx="275" cy="110" r="3"/><circle cx="295" cy="110" r="3"/>
                <circle cx="175" cy="125" r="3"/><circle cx="195" cy="125" r="3"/><circle cx="215" cy="125" r="3"/><circle cx="235" cy="125" r="3"/><circle cx="255" cy="125" r="3"/><circle cx="275" cy="125" r="3"/><circle cx="295" cy="125" r="3"/>
                <circle cx="175" cy="140" r="3"/><circle cx="195" cy="140" r="3"/><circle cx="215" cy="140" r="3"/><circle cx="235" cy="140" r="3"/><circle cx="255" cy="140" r="3"/><circle cx="275" cy="140" r="3"/><circle cx="295" cy="140" r="3"/>
            </g>
            <!-- Output Terminals -->
            <rect x="170" y="165" width="140" height="35" rx="4" fill="#020617"/>
            <text x="180" y="188" font-family="Arial,sans-serif" font-size="13" fill="#22c55e" font-weight="bold">+24V DC 10A</text>
            <!-- DC OK LED & Vadj -->
            <circle cx="185" cy="230" r="5" fill="#22c55e"/>
            <text x="198" y="234" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8">DC OK</text>
            <circle cx="270" cy="230" r="10" fill="#1e293b" stroke="#64748b"/>
            <line x1="265" y1="230" x2="275" y2="230" stroke="#f59e0b" stroke-width="2"/>
            <text x="255" y="252" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">Vadj</text>
            <!-- Input AC -->
            <rect x="170" y="275" width="140" height="35" rx="4" fill="#020617"/>
            <text x="180" y="297" font-family="Arial,sans-serif" font-size="11" fill="#f59e0b">100-240V AC IN</text>
            

    <!-- Product Title Badge at Bottom -->
    <rect x="30" y="340" width="420" height="36" rx="6" fill="#0b1329" stroke="#1e293b"/>
    <text x="45" y="363" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">DELTA Power Supply (SMPS)</text>
    <text x="435" y="363" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#f59e0b">CliQ DIN Rail 24V</text>
</svg>